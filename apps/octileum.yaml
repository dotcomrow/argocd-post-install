apiVersion: v1
kind: Secret
metadata:
  name: octileum
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: git@github.com:dotcomrow/k8s-octelium.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
    QyNTUxOQAAACATQwIegBd7SVUiobKpQ16SG5nqAi+ijAUC71ViR3ScXAAAAKhbxFB2W8RQ
    dgAAAAtzc2gtZWQyNTUxOQAAACATQwIegBd7SVUiobKpQ16SG5nqAi+ijAUC71ViR3ScXA
    AAAEDhxm6ZyWWIi1xocD3BOYzr+p9o+2OL7eXUm66SEU5QoxNDAh6AF3tJVSKhsqlDXpIb
    meoCL6KMBQLvVWJHdJxcAAAAHmFkbWluaXN0cmF0b3JAc3VuY29hc3Quc3lzdGVtcwECAw
    QFBgc=
    -----END OPENSSH PRIVATE KEY-----
  insecure: "true"
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: octelium
  namespace: argocd
spec:
  description: Project for Octelium app
  sourceRepos:
    - '*'
  destinations:
    - namespace: octelium
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: octileum
  namespace: argocd
spec:
  project: octelium
  source:
    repoURL: git@github.com:dotcomrow/k8s-octelium.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: octelium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true