apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: pfsense-logging
  namespace: argocd
spec:
  description: Project for pfSense logging
  sourceRepos:
    - '*'
  destinations:
    - namespace: pfsense-logging
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pfsense-logging
  namespace: argocd
  annotations:
    argocd.argoproj.io/config-management-plugin: avp-v1
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: pfsense-logging
  source:
    repoURL: https://github.com/dotcomrow/k8s-pfsense-logging.git
    targetRevision: prod
    path: manifests
    plugin:
      name: avp-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: pfsense-logging
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources
    - group: apps
      kind: DaemonSet
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources
    - group: batch
      kind: Job
      jqPathExpressions:
        - .spec.template.spec.containers[].resources
        - .spec.template.spec.initContainers[].resources
    - group: batch
      kind: CronJob
      jqPathExpressions:
        - .spec.jobTemplate.spec.template.spec.containers[].resources
        - .spec.jobTemplate.spec.template.spec.initContainers[].resources

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m