---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: rules-engine
  namespace: argocd
spec:
  description: Project for rules-engine app
  sourceRepos:
    - '*'
  destinations:
    - namespace: drools
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rules-engine
  namespace: argocd
spec:
  project: rules-engine
  source:
    repoURL: git@github.com:dotcomrow/k8s-rules-engine.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: drools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true