# apps/external-secrets-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        leaderElect: true

        # --- Disable Linkerd on ESO components that talk to kube-apiserver/webhooks
        certController:
          enabled: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          # Make cert-controller write/read the webhook TLS secret in *this* release namespace
          extraArgs:
            - --service-namespace=external-secrets
            - --secret-namespace=external-secrets
            - --service-name=external-secrets-webhook
            - --secret-name=external-secrets-webhook

        webhook:
          enabled: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          service:
            enabled: true
            type: ClusterIP
            # default name is "external-secrets-webhook"; keep it in sync with certController args

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    managedNamespaceMetadata:
      annotations:
        linkerd.io/inject: "disabled"
        field.cattle.io/projectId: "local:applications"
        # keep strict node placement on infra apps if you use this label:
        scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
