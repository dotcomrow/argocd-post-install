# apps/external-secrets-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        leaderElect: true

        # --- Cert Controller: keep certs/webhook wiring in this namespace
        certController:
          create: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          extraArgs:
            service-namespace: external-secrets
            secret-namespace: external-secrets
            service-name: external-secrets-webhook
            secret-name: external-secrets-webhook

        # --- Webhook: disable Linkerd and keep default service name
        webhook:
          create: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          service:
            enabled: true
            type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Apply annotations to the namespace Argo creates
    managedNamespaceMetadata:
      annotations:
        linkerd.io/inject: "disabled"
        field.cattle.io/projectId: "local:applications"
        scheduler.alpha.kubernetes.io/node-selector: "dedicated=srvr-node"
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
