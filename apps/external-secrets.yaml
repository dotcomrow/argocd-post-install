# apps/external-secrets-app.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app: external-secrets
  annotations:
    field.cattle.io/projectId: local:infrastructure
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 0.19.2
    helm:
      values: |
        installCRDs: true
        replicaCount: 1
        leaderElect: true
        affinity:
          nodeAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                preference:
                  matchExpressions:
                    - key: dedicated
                      operator: In
                      values:
                        - srvr-node

        # --- Cert Controller: keep certs/webhook wiring in this namespace
        certController:
          create: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: dedicated
                        operator: In
                        values:
                          - srvr-node
          extraArgs:
            service-namespace: external-secrets
            secret-namespace: external-secrets
            service-name: external-secrets-webhook
            secret-name: external-secrets-webhook

        # --- Webhook: disable Linkerd and keep default service name
        webhook:
          create: true
          podAnnotations:
            linkerd.io/inject: "disabled"
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: dedicated
                        operator: In
                        values:
                          - srvr-node
          service:
            enabled: true
            type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Apply annotations to the namespace Argo creates
    managedNamespaceMetadata:
      annotations:
        linkerd.io/inject: "disabled"
        field.cattle.io/projectId: "local:infrastructure"
    syncOptions:
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
