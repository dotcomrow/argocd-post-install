# -----------------------------------------------------------------------------
# Argo CD: Git repo secret (unchanged)
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: kafka
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: https://github.com/dotcomrow/k8s-kafka.git
  insecure: "true"
---
# -----------------------------------------------------------------------------
# Argo CD: Project (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kafka
  namespace: argocd
spec:
  description: Project for kafka app
  sourceRepos:
    - '*'
  destinations:
    - namespace: kafka
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: yugabyte
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
# -----------------------------------------------------------------------------
# Argo CD: Your existing "kafka" application (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: kafka
  source:
    repoURL: https://github.com/dotcomrow/k8s-kafka.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m