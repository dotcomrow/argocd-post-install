  name: kafka
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: git@github.com:dotcomrow/k8s-kafka.git
  sshPrivateKey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
    QyNTUxOQAAACDcEudk5MiuuuChnksjsvb5rF9qhIYCSo8eUBINdQB7pQAAAKhdCvJEXQry
    RAAAAAtzc2gtZWQyNTUxOQAAACDcEudk5MiuuuChnksjsvb5rF9qhIYCSo8eUBINdQB7pQ
    AAAEAdi5z9EeWtr2GM1LeQ5aSrKQKddYhKonqn006DrccH7dwS52TkyK664KGeSyOy9vms
    X2qEhgJKjx5QEg11AHulAAAAHmFkbWluaXN0cmF0b3JAc3VuY29hc3Quc3lzdGVtcwECAw
    QFBgc=
