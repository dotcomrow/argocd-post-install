# -----------------------------------------------------------------------------
# Argo CD: Project (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kafka
  namespace: argocd
spec:
  description: Project for kafka app
  sourceRepos:
    - '*'
  destinations:
    - namespace: kafka
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: yugabyte
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
# -----------------------------------------------------------------------------
# Argo CD: Your existing "kafka" application (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: kafka
  source:
    repoURL: git@github.com:dotcomrow/k8s-kafka.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# -----------------------------------------------------------------------------
# NEW: Argo CD Application to deploy Debezium Platform (Helm) to namespace "kafka"
# Notes:
# - Pulls directly from upstream Debezium Platform repo (public).
# - Uses the chart in /helm with values to point at your Connect and set CORS.
# - fullnameOverride keeps names predictable (svc/debezium-platform-ui, etc.).
# - Keep this separate from your existing standalone Debezium UI so you can A/B.
# -----------------------------------------------------------------------------
# --- Debezium Platform UI via Helm (Argo CD) — FIXED values ---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: debezium-platform
  namespace: argocd
spec:
  project: kafka
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  source:
    repoURL: https://github.com/debezium/debezium-platform.git
    targetRevision: main
    path: helm
    helm:
      values: |
        fullnameOverride: debezium-platform

        domain:
          url: "debezium-ui.app.suncoast.systems"
          scheme: "https"

        database:
          enabled: true
          image: "quay.io/debezium/postgres:14-alpine"   # must be a string
          auth:
            username: "debezium"
            password: "debezium"
            database: "conductor"
          persistence:
            enabled: false

        kafka:
          enabled: false
        connect:
          enabled: false
        registry:
          enabled: false

        # Stage (web UI)
        stage:
          # This is what controls the generated env-config.js
          envConfig:
            # Make the UI call the Conductor API via the same host under /api (no mixed content)
            conductorUrl: "/api"

          # (Optional) If your chart exposes extra envs for the UI container:
          env:
            QUARKUS_LOG_LEVEL: "INFO"

        # Debezium UI (classic) - kept disabled since you’re using Platform Stage
        ui:
          fullnameOverride: debezium-ui
          env:
            KAFKA_CONNECT_URIS: "http://kafka-connect.kafka.svc.cluster.local:8083"
            QUARKUS_HTTP_PROXY_PROXY_ADDRESS_FORWARDING: "true"
            QUARKUS_HTTP_CORS: "true"
            QUARKUS_HTTP_CORS_ORIGINS: "https://debezium-ui.app.suncoast.systems"
            QUARKUS_LOG_LEVEL: "DEBUG"
          service:
            type: ClusterIP
            port: 8080
          ingress:
            enabled: false

        # Conductor API (no ingress; you route /api to this service via your own Ingress)
        conductor:
          ingress:
            enabled: false
          env:
            QUARKUS_HTTP_CORS: "true"
            QUARKUS_HTTP_CORS_ORIGINS: "https://debezium-ui.app.suncoast.systems"

        # Global ingress toggle off (we use our own)
        ingress:
          enabled: false
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
