---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cockroach-db
  namespace: argocd
spec:
  description: Project for cockroach-db app
  sourceRepos:
    - '*'
  destinations:
    - namespace: cockroach-db
      server: https://kubernetes.default.svc
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cockroach-db
  namespace: argocd
spec:
  project: cockroach-db
  source:
    repoURL: git@github.com:dotcomrow/k8s-cockroach-db.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cockroach-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true