  name: cockroach-db
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: git@github.com:dotcomrow/k8s-cockroach-db.git
  sshPrivateKey: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
      QyNTUxOQAAACBtjMYlu3xWyRPxhc25ofGTElv85escnxUxtkaBVss3oQAAAKibum8Im7pv
      CAAAAAtzc2gtZWQyNTUxOQAAACBtjMYlu3xWyRPxhc25ofGTElv85escnxUxtkaBVss3oQ
      AAAECJLHctH/qe0gOnM6uOK+Myf/xeo/v8eaFSC68bHSMyCW2MxiW7fFbJE/GFzbmh8ZMS
      W/zl6xyfFTG2RoFWyzehAAAAHmFkbWluaXN0cmF0b3JAc3VuY29hc3Quc3lzdGVtcwECAw
      QFBgc=
