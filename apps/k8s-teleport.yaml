apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: k8s-teleport
  namespace: argocd
spec:
  description: Project for k8s-teleport
  sourceRepos:
    - '*'
  destinations:
    - namespace: k8s-teleport
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-teleport
  namespace: argocd
  annotations:
    argocd.argoproj.io/config-management-plugin: avp-v1
spec:
  project: k8s-teleport
  source:
    repoURL: git@github.com:dotcomrow/k8s-teleport.git
    targetRevision: prod
    path: manifests
    plugin:
      name: avp-v1
  destination:
    server: https://kubernetes.default.svc
    namespace: k8s-teleport
  syncPolicy:
    automated:
      prune: true
      selfHeal: true