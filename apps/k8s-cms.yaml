  url: git@github.com:dotcomrow/k8s-cms.git
  sshPrivateKey: |
      -----BEGIN OPENSSH PRIVATE KEY-----
      b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
      QyNTUxOQAAACAF3IHOlIIs9B/UcfaZ2vjdOjekZ9ds4bUf3bUMkbGXSQAAAKicrpVqnK6V
      agAAAAtzc2gtZWQyNTUxOQAAACAF3IHOlIIs9B/UcfaZ2vjdOjekZ9ds4bUf3bUMkbGXSQ
      AAAEAJNNIhItyzuZmtRgCUOJoyWITVNUuGCOTANejoSJTpvgXcgc6Ugiz0H9Rx9pna+N06
      N6Rn12zhtR/dtQyRsZdJAAAAHmFkbWluaXN0cmF0b3JAc3VuY29hc3Quc3lzdGVtcwECAw
