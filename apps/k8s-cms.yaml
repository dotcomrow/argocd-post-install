# -----------------------------------------------------------------------------
# Argo CD: Project (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cms
  namespace: argocd
spec:
  description: Project for cms app
  sourceRepos:
    - '*'
  destinations:
    - namespace: cms
      server: https://kubernetes.default.svc
    - namespace: vault
      server: https://kubernetes.default.svc
    - namespace: yugabyte
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
---
# -----------------------------------------------------------------------------
# Argo CD: Your existing "kafka" application (unchanged)
# -----------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cms
  namespace: argocd
spec:
  project: cms
  source:
    repoURL: git@github.com:dotcomrow/k8s-cms.git
    targetRevision: prod
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cms
  syncPolicy:
    automated:
      prune: true
      selfHeal: true